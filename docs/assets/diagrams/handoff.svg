<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Pre-match handoff flow</title>
  <desc id="desc">A tap on the banner writes the selected match and updates the running app state before opening it. A cold start falls back to the JSON file.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7ee787"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffa657"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#08111d"/>
  <text x="48" y="52" fill="#e6edf3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Tap → correct match, even when the app is already running</text>
  <text x="48" y="78" fill="#8fa2b5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">The handoff removes the stale-file and open-before-write race from the old flow.</text>

  <rect x="44" y="126" width="214" height="112" rx="14" fill="#111e2b" stroke="#2a4052"/>
  <text x="68" y="160" fill="#e6edf3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1 · Tap the banner</text>
  <text x="68" y="184" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">“Real Sociedad – Lyon”</text>
  <text x="68" y="204" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">in 20-my-matches.owl</text>

  <rect x="326" y="104" width="244" height="156" rx="14" fill="#0e2a20" stroke="#2f6b4f"/>
  <text x="350" y="138" fill="#7ee787" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2 · Persist + handoff</text>
  <text x="350" y="163" fill="#c4d6c7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">~/.cache/prematch-match.json</text>
  <text x="350" y="184" fill="#c4d6c7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">owl-send prematch.owl</text>
  <text x="350" y="203" fill="#c4d6c7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">set handoff &lt;match&gt;</text>
  <text x="350" y="232" fill="#8fa2b5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">state update if running</text>

  <rect x="638" y="126" width="222" height="112" rx="14" fill="#111e2b" stroke="#2a4052"/>
  <text x="662" y="160" fill="#e6edf3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3 · Open the app</text>
  <text x="662" y="184" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">open("o:prematch.owl")</text>
  <text x="662" y="204" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">same app, no copy</text>

  <rect x="928" y="88" width="228" height="88" rx="14" fill="#0e2a20" stroke="#2f6b4f"/>
  <text x="952" y="121" fill="#7ee787" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">running</text>
  <text x="952" y="144" fill="#c4d6c7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">state handoff wins</text>

  <rect x="928" y="210" width="228" height="88" rx="14" fill="#2a1e10" stroke="#6f5221"/>
  <text x="952" y="243" fill="#ffd18a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">cold start</text>
  <text x="952" y="266" fill="#d8b77c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">file fallback is read</text>

  <line x1="258" y1="182" x2="326" y2="182" stroke="#7ee787" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="182" x2="638" y2="182" stroke="#7ee787" stroke-width="2" marker-end="url(#a)"/>
  <line x1="860" y1="166" x2="928" y2="134" stroke="#7ee787" stroke-width="2" marker-end="url(#a)"/>
  <line x1="860" y1="204" x2="928" y2="244" stroke="#ffa657" stroke-width="2" marker-end="url(#b)"/>

  <rect x="280" y="306" width="640" height="72" rx="14" fill="#111e2b" stroke="#2a4052"/>
  <text x="304" y="335" fill="#e6edf3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Why both paths</text>
  <text x="304" y="357" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">The state fixes an already-warm app; the file keeps the feature working after a reboot or process kill.</text>
</svg>
