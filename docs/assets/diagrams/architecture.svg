<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">My Matches architecture: public data to Omalauncher</title>
  <desc id="desc">ESPN, Football-Data and Understat feed local scripts and caches, which drive the OWL tile and the pre-match app inside Omalauncher.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7ee787"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111d"/>
      <stop offset="1" stop-color="#0d1a27"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <text x="54" y="58" fill="#e6edf3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">From public data to the home screen</text>
  <text x="54" y="86" fill="#8fa2b5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Local-first OWL widget + pre-match app · no account, no backend, no telemetry</text>

  <text x="56" y="132" fill="#7ee787" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PUBLIC SOURCES</text>
  <rect x="52" y="146" width="278" height="92" rx="12" fill="#101b26" stroke="#26394c"/>
  <text x="72" y="176" fill="#e6edf3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">ESPN API</text>
  <text x="72" y="200" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">scores · fixtures · tables</text>
  <text x="72" y="219" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">odds · lineups · news</text>

  <rect x="52" y="254" width="278" height="92" rx="12" fill="#101b26" stroke="#26394c"/>
  <text x="72" y="284" fill="#e6edf3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Football-Data.co.uk</text>
  <text x="72" y="308" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">xG fallback · shots · cards</text>
  <text x="72" y="327" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Ligue 2 and uncovered teams</text>

  <rect x="52" y="362" width="278" height="92" rx="12" fill="#101b26" stroke="#26394c"/>
  <text x="72" y="392" fill="#e6edf3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Understat</text>
  <text x="72" y="416" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">20-match xG history</text>
  <text x="72" y="435" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">top five leagues</text>

  <rect x="390" y="126" width="380" height="404" rx="18" fill="#0c1621" stroke="#294052"/>
  <text x="414" y="160" fill="#79c0ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">LOCAL LINUX LAYER</text>
  <rect x="414" y="180" width="332" height="70" rx="10" fill="#111e2b" stroke="#2a4052"/>
  <text x="432" y="207" fill="#e6edf3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">sync scripts</text>
  <text x="432" y="229" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">bash · jq · curl · python3 · node</text>

  <rect x="414" y="264" width="332" height="70" rx="10" fill="#111e2b" stroke="#2a4052"/>
  <text x="432" y="291" fill="#e6edf3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">normalisation</text>
  <text x="432" y="313" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">stable IDs · aliases · dedupe</text>

  <rect x="414" y="348" width="332" height="92" rx="10" fill="#0e2a20" stroke="#2f6b4f"/>
  <text x="432" y="377" fill="#7ee787" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">cache-first JSON</text>
  <text x="432" y="399" fill="#a9d8b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">~/.cache/espn-*</text>
  <text x="432" y="418" fill="#a9d8b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">~/.cache/understat/</text>

  <rect x="414" y="454" width="332" height="54" rx="10" fill="#111e2b" stroke="#2a4052"/>
  <text x="432" y="478" fill="#e6edf3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">fd-analysis.js</text>
  <text x="432" y="496" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">rolling 5 · 20 matches · signal</text>

  <rect x="826" y="126" width="322" height="404" rx="18" fill="#0c1621" stroke="#294052"/>
  <text x="850" y="160" fill="#ffa657" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">OMALAUNCHER / OWL</text>
  <rect x="850" y="182" width="274" height="92" rx="10" fill="#111e2b" stroke="#2a4052"/>
  <text x="868" y="211" fill="#e6edf3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">20-my-matches.owl</text>
  <text x="868" y="233" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">tile · full match centre</text>
  <text x="868" y="252" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">live · fixtures · brackets</text>

  <rect x="850" y="292" width="274" height="92" rx="10" fill="#111e2b" stroke="#2a4052"/>
  <text x="868" y="321" fill="#e6edf3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">prematch.owl</text>
  <text x="868" y="343" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">hero · stats · analysis</text>
  <text x="868" y="362" fill="#9eb1c1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">lineups · news · travel</text>

  <rect x="850" y="402" width="274" height="54" rx="10" fill="#2a1e10" stroke="#6f5221"/>
  <text x="868" y="426" fill="#ffd18a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">tap banner → handoff</text>
  <text x="868" y="444" fill="#d8b77c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">correct match opens immediately</text>

  <line x1="330" y1="192" x2="390" y2="215" stroke="#7ee787" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="300" x2="390" y2="299" stroke="#7ee787" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="408" x2="390" y2="382" stroke="#7ee787" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="388" x2="826" y2="320" stroke="#7ee787" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="480" x2="826" y2="435" stroke="#ffa657" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="356" y="184" fill="#7ee787" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10">GET</text>
  <text x="356" y="290" fill="#7ee787" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10">GET</text>
  <text x="356" y="402" fill="#7ee787" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10">GET</text>
  <text x="782" y="362" fill="#7ee787" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10">file/JSON</text>

  <rect x="52" y="540" width="1096" height="92" rx="14" fill="#0b1d16" stroke="#2a5a42"/>
  <text x="76" y="572" fill="#7ee787" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Design rules</text>
  <text x="76" y="596" fill="#c4d6c7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Cache first · progressive enhancement · no API keys · no account · local caches only · graceful fallback when a source is down.</text>
  <text x="76" y="616" fill="#8fa2b5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">The tile stays useful offline with the last successful snapshot; xG history is refreshed every 12 h and never blocks the live score.</text>
</svg>
